[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debt-verify"
version = "0.1.0"
description = "Verifiable execution of sovereign debt restructuring clauses under data revision"
requires-python = ">=3.10"
license = "Apache-2.0"
dependencies = ["z3-solver>=4.12"]

[tool.setuptools]
packages = ["debtverify"]

[tool.setuptools.package-data]
debtverify = ["data/*.json"]


[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
debt-verify = "debtverify.cli:main"
