[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "debt-verify"
version = "0.1.0"
description = "Verifiable execution of sovereign debt restructuring clauses under data revision"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
reductions = ["z3-solver"]
test = ["pytest", "z3-solver"]

[project.scripts]
debt-verify = "debtverify.cli:main"
